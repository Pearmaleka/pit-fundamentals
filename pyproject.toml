[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitfund"
version = "0.1.0"
description = "Point-in-time fundamentals from the SEC Financial Statement Data Sets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Le Nam Khanh" }]
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pitfund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
